name: PitPitch
options:
  bundleIdPrefix: com.cgl
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "18"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PitPitch:
    type: application
    platform: iOS
    sources:
      - path: PitPitch
        excludes:
          - Resources/MediaDerived
      - path: PitPitch/Resources/MediaDerived
        type: folder
        buildPhase: resources
      - path: ../shared/assets
        type: folder
        buildPhase: resources
      - path: ../shared/branding
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Verify shared resources offline
        script: '"$SRCROOT/Scripts/verify_resources.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.cgl.pitpitch
        INFOPLIST_KEY_CFBundleDisplayName: PitPitch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PitPitchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: PitPitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cgl.pitpitch.tests
  PitPitchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: PitPitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cgl.pitpitch.uitests
schemes:
  PitPitch:
    build:
      targets:
        PitPitch: all
    test:
      targets:
        - PitPitchTests
        - PitPitchUITests
